name: Release

# 推 vX.Y.Z tag 时发版。版本号以 mygo.json 为准：tag 和它不一致直接失败。
# mygo build 负责签名、生成更新清单，并上传到该版本的 GitHub release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要重发的 tag，例如 v1.2.0
        required: true

permissions:
  contents: write # 草稿 release 及上传

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动触发时默认检出的是分支，会拿到 mygo.json 的最新版本；必须对准 tag。
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 校验 tag 与 mygo.json 版本一致
        shell: pwsh
        env:
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $ver = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          if ($ver -ne $env:REF_NAME.TrimStart('v')) {
            throw "tag $env:REF_NAME 与 mygo.json 的版本 $ver 不一致"
          }

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@v3

      # ocrbridge 全量编译要三四分钟，缓存命中后只剩链接。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ocrbridge

      - name: 单测
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go test ./...

      # 先建草稿，让发布标题和自动生成的说明保持一贯；mygo build 再把文件传进去。
      - name: 创建草稿 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view $env:TAG --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --repo ${{ github.repository }} --draft --verify-tag `
              --title "快速扫描 $($env:TAG.TrimStart('v'))" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "创建草稿 $env:TAG 失败" }
          }

      # 构建、签名，并把安装包 / 更新归档 / 更新清单上传到 vX.Y.Z 草稿 release。
      # mygo build 在 Windows runner 上会自行下载 NSIS。
      - name: 构建、签名并上传
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: just release

      - name: 发布
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release edit $env:TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw "发布 $env:TAG 失败" }
