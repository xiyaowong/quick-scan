# 手动发布：Actions 页面点 "Run workflow" → 构建 → 发布 GitHub Release。
# Release 名称 = 触发时间（北京时间）；tag 用 ASCII 的 release-<UTC时间戳>。
#
# 产物（免安装 zip，与本地 just package 一致）：
#   SimpleMFPScan-<版本>-win64.zip   内含单个 64 位 exe（OCR 模型已内嵌）
name: 发布 Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 取代码
        uses: actions/checkout@v7

      - name: 装 Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      # OCR 桥是 Rust staticlib（OCR 模型推理），必须装 Rust。
      - name: 装 Rust（x86_64-pc-windows-msvc）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 装 just
        uses: extractions/setup-just@v3

      # runner 预装 MinGW（windres）与 LLVM（clang）；Go 的 cgo 链接需要 clang。
      - name: 校验工具链齐全
        run: |
          $missing = @()
          foreach ($c in 'go','just','windres','clang','cargo') {
            if (-not (Get-Command $c -ErrorAction SilentlyContinue)) { $missing += $c }
          }
          if ($missing) { Write-Error "缺少工具链：$($missing -join ', ')"; exit 1 }

      - name: 记录触发时间
        id: stamp
        run: |
          # 名称给人看 → 北京时间；tag 必须 ASCII → UTC，避免中文 tag 在各处的编码坑
          $cn = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId(
            (Get-Date).ToUniversalTime(), 'China Standard Time')
          "tag=release-$($cn.ToString('yyyyMMdd-HHmmss'))" >> $env:GITHUB_OUTPUT
          "name=$($cn.ToString('yyyy-MM-dd HH:mm:ss'))" >> $env:GITHUB_OUTPUT

      - name: 构建并打包
        run: |
          just package
          Get-ChildItem dist | ForEach-Object { "  $($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.stamp.outputs.tag }}
          name: ${{ steps.stamp.outputs.name }}
          body: |
            自动构建，触发时间 ${{ steps.stamp.outputs.name }}（提交 ${{ github.sha }}）。

            - `SimpleMFPScan-*.zip` — 免安装包，解压即用。单文件：OCR 模型已内嵌在
              exe 里，运行时释放到 %TEMP%，退出即清。

            仅支持 Windows 10/11 64 位。扫描走局域网 eSCL（Mopria/AirPrint 扫描协议），
            设备需与电脑在同一网段，无需安装厂商驱动。
          files: dist/*.zip
          fail_on_unmatched_files: true
