name: CI

# 每次改动都验一遍：单测 + 真实编译 + 安装包。release.yml 只在发版时跑，
# 构建问题要在这里暴露，而不是等到发版那天。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@v3

      # windows-latest 自带 LLVM（clang）和 Rust，windres 和 makensis 都得自己装。
      # choco 写进机器 PATH 之后已启动的 runner 不重读，显式补一次。
      - name: 安装 MinGW 和 NSIS
        shell: pwsh
        run: |
          choco install mingw nsis --no-progress -y
          @(
            "C:\ProgramData\mingw64\bin"
            "C:\Program Files (x86)\NSIS"
          ) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # ocrbridge 全量编译要三四分钟，缓存命中后只剩链接。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ocrbridge

      - name: 单测
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go test ./...

      # 两个 step 分开：合在一起时 just package 的成功会盖掉 just installer
      # 的失败，step 照样报绿，安装包没编出来也没人知道。
      - name: 编安装包
        shell: pwsh
        run: just installer

      - name: 打包免安装版
        shell: pwsh
        run: just package

      # upload-artifact 默认 if-no-files-found: warn，缺文件也算成功。
      - name: 核对产物
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*-setup.exe
          $zip = Get-ChildItem dist\*-win64.zip
          if (-not $exe) { throw '没有安装包' }
          if (-not $zip) { throw '没有免安装包' }
          Write-Host "$($exe.Name) / $($zip.Name)"

      - uses: actions/upload-artifact@v4
        with:
          name: quick-scan-installer
          if-no-files-found: error
          path: |
            dist/*-setup.exe
            dist/*-win64.zip
