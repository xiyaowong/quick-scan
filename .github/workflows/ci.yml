name: CI

# 每次改动都验一遍：单测 + 真实编译 + 安装包。release.yml 只在发版时跑，
# 构建问题要在这里暴露，而不是等到发版那天。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@v3

      # ocrbridge 全量编译要三四分钟，缓存命中后只剩链接。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ocrbridge

      - name: 单测
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go test ./...

      # 不带签名密钥：只验应用、安装包和打包流程本身。
      - name: 构建
        shell: pwsh
        run: just build

      # upload-artifact 默认 if-no-files-found: warn，缺文件也算成功。
      - name: 核对产物
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\windows-amd64\quick-scan.exe
          $setup = Get-ChildItem dist\windows-amd64\*-setup-*.exe
          if (-not $exe) { throw '没有主程序' }
          if (-not $setup) { throw '没有安装包' }
          Write-Host "$($exe.Name) / $($setup.Name)"

      - uses: actions/upload-artifact@v4
        with:
          name: quick-scan
          if-no-files-found: error
          path: |
            dist/windows-amd64/quick-scan.exe
            dist/windows-amd64/*-setup-*.exe
